services:
  receipt-ocr-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receipt-ocr-hub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/ocr_hub.db
      - UPLOADS_DIR=/app/data/uploads
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
